name: CI

on:
  pull_request:
    branches:
      - master

  workflow_dispatch: # allow running manually

permissions:
  contents: read # condition for GITHUB_TOKEN

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Allows the workflow to modify pull requests using GITHUB_TOKEN: comments PR
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
  build:
    name: Build, Test & Report
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven # cache .m2

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Show build environment
        run: |
          echo "Java:"
          java --version
          
          echo ""
          echo "Maven:"
          ./mvnw --version
          
          echo ""
          echo "Git:"
          git --version

      - name: Build and Verify
        # check integration test results and quality metrics
        run: | 
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify 

      - name: Generate CI Statistics
        if: always()
        run: |
          {
            echo "## MiniRedis CI Report"
            echo ""

            echo "### Tests"
            echo '```'

            if [ -d target/surefire-reports ]; then
              grep -h "Tests run:" target/surefire-reports/*.txt || echo "No tests found"
            else
              echo "No test reports found"
            fi

            echo '```'
            echo ""

            echo "### Reports"
            echo "- JaCoCo coverage report uploaded as artifact"
            echo "- Surefire test report uploaded as artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mini-redis-jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload MiniRedis JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mini-redis
          # include target/*.jar and exclude target/original-*.jar
          path: |
            target/*.jar
            !target/original-*.jar
          retention-days: 7

  compatibility:
    name: Java ${{ matrix.java }} Compatibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [ 21, 25 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
      - name: Run test on Java ${{ matrix.java }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean test